; Compile test for the libraries bundled with the framework. Blink only pulls
; in the core, so without this CI never builds them.
;
; Boards, platform and the framework symlink come from tests/blink, so the two
; tests can't drift apart:
;
;   pio run -d tests/libraries -e xiao_nrf54l15

[platformio]
extra_configs = ../blink/platformio.ini
