; Minimal smoke test: compile a blink sketch against the in-tree
; framework for every nRF54L board variant we ship.
;
; The CI workflow at .github/workflows/githubci.yml runs this for each
; matrix board on Ubuntu. Local builds work too:
;
;   pio run -d tests/blink -e xiao_nrf54l15

[platformio]
default_envs = xiao_nrf54l15, xiao_nrf54l15_sense, nrf54l15dk, nrf54l10dk, nrf54l05dk

[env]
platform = https://github.com/meshtastic/platform-nordicnrf54.git
framework = arduino
; Force PlatformIO to use *this* checkout of the framework rather than
; cloning the published one. Path is relative to the project dir
; (tests/blink/), so ../.. is the repo root.
platform_packages =
    framework-arduinoadafruitnrf54 @ symlink://../..

[env:xiao_nrf54l15]
board = xiao_nrf54l15

[env:xiao_nrf54l15_sense]
board = xiao_nrf54l15_sense

[env:nrf54l15dk]
board = nrf54l15dk

[env:nrf54l10dk]
board = nrf54l10dk

[env:nrf54l05dk]
board = nrf54l05dk
